<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Showcase</Playlist>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* กรอบแสดงผลเพลย์ลิสต์ */
        .playlist-container {
            width: 100%;
            max-width: 900px;
            height: 550px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid #d1d5db;
            overflow: hidden; /* บังคับให้ขอบมน */
        }

        .web-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="playlist-container">
        <iframe 
            src="https://www.youtube.com/embed/videoseries?list=PLZhFz9PfeJnkQ08Zh4bYwqdPuHXAIoZql" 
            class="web-frame"
            sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
            allow="autoplay; encrypted-media; fullscreen"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
