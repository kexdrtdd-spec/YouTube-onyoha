<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Frame</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* กรอบโชว์และปฏิสัมพันธ์กับเว็บไซต์ */
        .web-container {
            width: 100%;
            max-width: 1000px;
            height: 650px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid #d1d5db;
            overflow: hidden; /* บังคับให้ขอบมน */
        }

        /* ตัวแสดงผลหน้าเว็บ */
        .web-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="web-container">
        <iframe 
            src="https://www.youtube.com/?hl=th&gl=TH&app=desktop" 
            class="web-frame"
            sandbox="allow-scripts allow-forms allow-same-origin">
        </iframe>
    </div>

</body>
</html>
